# Lint, typecheck, unit tests, and a production build on every push and pull request.
# Needs no secrets: database tests run on embedded Postgres (PGlite), and the build uses placeholder env.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholders so `next build` can evaluate config; nothing connects to them.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      APP_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci # runs `prisma generate` through postinstall
      - run: npx prisma validate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
